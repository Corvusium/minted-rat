name: Build MintedRAT
on: push
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install vcpkg & dependencies (dynamic)
        run: |
          git clone https://github.com/microsoft/vcpkg
          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg install dpp:x64-windows nlohmann-json:x64-windows curl:x64-windows sqlite3:x64-windows openssl:x64-windows
        shell: pwsh

      - name: Build RAT
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows
          cmake --build build --config Release
        shell: pwsh

      - name: Collect binaries
        run: |
          mkdir upload
          copy build\Release\MintedRAT.exe upload\
          copy vcpkg\installed\x64-windows\bin\*.dll upload\
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: MintedRAT
          path: upload\
